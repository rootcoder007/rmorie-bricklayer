# goodpractice, every check but two: lintr (80 columns), cyclomatic
# complexity (15 at most per function), function length (50 lines),
# roxygen, spelling and the rest. Any failed check fails the job.
# Its covr and rcmdcheck checks are left out because r-coverage.yml (the
# full test suite under covr, Codecov at 100%) and R-CMD-check.yaml (six
# platforms) run the same work on every push; here they took two hours.
name: goodpractice

on:
  push:
    branches: [main, ropensci]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goodpractice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goodpractice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      PKG_USE_BIOCONDUCTOR: "false"
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Install libcurl (C++ SystemRequirement)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::goodpractice, any::srr, any::curl
          needs: check

      - name: goodpractice (all but covr and rcmdcheck)
        shell: Rscript {0}
        run: |
          # the srr roclet (DESCRIPTION) defines the @srrstats tags roxygen reads
          loadNamespace("srr")
          ck <- goodpractice::all_checks()
          ck <- ck[!grepl("^(covr|rcmdcheck)", ck)]
          g <- goodpractice::gp(".", checks = ck)
          print(g)
          failed <- goodpractice::failed_checks(g)
          # urlchecker gives every address 5 seconds (options(timeout = 5)
          # inside url_check(), not settable), so a slow server reads as a
          # broken link. Each address it flagged is asked again with 60
          # seconds and three tries; one still unreachable, or answering
          # 4xx/5xx, fails the job.
          if ("urlchecker_ok" %in% failed) {
            db <- g$urlchecker
            urls <- unique(db$URL[db$Status != "200"])
            ok <- vapply(urls, function(u) {
              for (k in 1:3) {
                h <- curl::new_handle(timeout = 60, followlocation = TRUE)
                r <- tryCatch(
                  curl::curl_fetch_memory(u, handle = h)$status_code,
                  error = function(e) NA_integer_
                )
                if (!is.na(r) && r < 400L) return(TRUE)
                Sys.sleep(10)
              }
              FALSE
            }, NA)
            for (u in urls) cat(if (ok[[u]]) "reachable:" else "BROKEN:", u, "\n")
            if (all(ok)) failed <- setdiff(failed, "urlchecker_ok")
          }
          if (length(failed)) {
            cat("failed checks:", paste(failed, collapse = ", "), "\n")
            quit(status = 1L)
          }
