# goodpractice, every check: the package's own R CMD check, coverage, lintr
# (80 columns), cyclomatic complexity (15 at most per function), function
# length (50 lines) and the rest.
# rOpenSci's editors read this report, so no check is skipped and any failed
# check fails the job.
name: goodpractice

on:
  push:
    branches: [main, ropensci]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goodpractice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goodpractice:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      PKG_USE_BIOCONDUCTOR: "false"
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Install libcurl (C++ SystemRequirement)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::goodpractice, any::rcmdcheck, any::covr, any::srr
          needs: check

      # the PDF manual check needs LaTeX, which the runner does not have
      - uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: LaTeX packages the R manual uses
        run: tlmgr install inconsolata

      # OpenSSL 3.5 with its FIPS provider, as in r-coverage.yml (same cache),
      # so the coverage check runs cpsxvrf()'s and fipsmod()'s real tests
      - name: Cache OpenSSL 3.5
        id: ossl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.9-fips-${{ runner.os }}-${{ runner.arch }}
      - name: Build OpenSSL 3.5
        if: steps.ossl.outputs.cache-hit != 'true'
        env:
          V: "3.5.9"
          SHA: >-
            603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          u=https://github.com/openssl/openssl/releases/download
          curl -fsSLo o.tgz "$u/openssl-$V/openssl-$V.tar.gz"
          echo "$SHA  o.tgz" | sha256sum -c -
          tar xzf o.tgz && cd "openssl-$V"
          ./Configure --prefix="$HOME/openssl-3.5" --libdir=lib \
            enable-fips no-shared no-docs no-tests > /dev/null
          make -j"$(nproc)" > /dev/null
          make install_sw install_fips > /dev/null
      - name: Put OpenSSL 3.5 first on the PATH
        run: |
          echo "$HOME/openssl-3.5/bin" >> "$GITHUB_PATH"
          "$HOME/openssl-3.5/bin/openssl" version

      - name: goodpractice (all checks)
        shell: Rscript {0}
        run: |
          # the srr roclet (DESCRIPTION) defines the @srrstats tags roxygen reads
          loadNamespace("srr")
          g <- goodpractice::gp(".", checks = goodpractice::all_checks())
          print(g)
          failed <- goodpractice::failed_checks(g)
          if (length(failed)) {
            cat("failed checks:", paste(failed, collapse = ", "), "\n")
            quit(status = 1L)
          }
