# The checks the rOpenSci review bot runs on a submission: pkgcheck() in the
# bot's own image, with goodpractice's full R CMD check and covr (the parts
# goodpractice.yml leaves out), srr standards, duplicated names and the rest.
# The container gets a 2 GB memory cap, so a suite that only fits on a large
# runner fails here first instead of on the bot.
name: pkgcheck

on:
  push:
    branches: [ropensci-checks, ropensci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgcheck:
    name: pkgcheck (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    # the bot's server sets no container limit, so its memory is the size of
    # its machine, which is not published. The suite is required to pass in
    # 2 GB. The two smaller sizes are reported, not required: pkgcheck's own R
    # process holds about 800 MB for this package once coverage is in, so at
    # 1.5 GB it is stopped in goodpractice's R CMD check step, and at 1 GB a
    # test process is stopped during coverage, whatever the tests themselves
    # need. They stay in the matrix so a change in either direction is seen.
    continue-on-error: ${{ matrix.required == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2 GB
            mem: 2g
            swap: 2g
            required: true
          - label: 1 GB + 1 GB swap
            mem: 1g
            swap: 2g
            required: false
          - label: 1.5 GB
            mem: 1536m
            swap: 1536m
            required: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: dependencies, without a memory cap
        # the bot's server has its dependencies already; compiling them here
        # (RcppEigen, stringi, ...) takes more than 2 GB on its own, so they are
        # installed first and the cap covers only what the bot runs
        run: |
          mkdir -p .pkgcheck/lib
          # PKG_SYSREQS=false: the image already has every -dev library the
          # dependencies build against; letting pak add more (gdal-bin from
          # the ubuntugis PPA) fails whenever launchpad.net times out
          docker run --rm -e GITHUB_TOKEN -e PKG_SYSREQS=false \
            -v "$PWD:/pkg" -w /pkg \
            --entrypoint Rscript \
            ghcr.io/ropensci-review-tools/pkgcheck-action:latest -e '
              .libPaths(c("/pkg/.pkgcheck/lib", .libPaths()))
              pak::lockfile_create("local::.", lockfile = ".pkgcheck/pkg.lock",
                                   dependencies = "all")
              pak::lockfile_install(".pkgcheck/pkg.lock",
                                    lib = "/pkg/.pkgcheck/lib")
            '
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: pkgcheck in the bot's image, memory cap ${{ matrix.label }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MEM: ${{ matrix.mem }}
          MEMSWAP: ${{ matrix.swap }}
        run: |
          cat > .pkgcheck/run.R <<'RSCRIPT'
          .libPaths(c("/pkg/.pkgcheck/lib", .libPaths()))
          pkgstats::ctags_install(sudo = TRUE)
          # covr deletes its directory when it is done, the output of a failed
          # test run with it; a copy of every testthat.Rout.fail is kept here
          dir.create("/pkg/.pkgcheck/fail", showWarnings = FALSE)
          trace(
            "testInstalledPackage", where = asNamespace("tools"),
            print = FALSE, exit = quote(file.copy(
              list.files(outDir, "[.]Rout[.]fail$", full.names = TRUE,
                         recursive = TRUE),
              "/pkg/.pkgcheck/fail", overwrite = TRUE
            ))
          )
          x <- pkgcheck::pkgcheck(".")
          s <- capture.output(summary(x))
          writeLines(s)
          gp <- x$goodpractice
          cat("\n== R CMD check\n")
          rc <- gp$rcmdcheck
          if (inherits(rc, "try-error")) cat(rc) else {
            cat("errors:", length(rc$errors), " warnings:",
                length(rc$warnings), " notes:", length(rc$notes), "\n")
            writeLines(c(rc$errors, rc$warnings))
          }
          cat("\n== covr\n")
          cv <- gp$covr
          if (inherits(cv, "try-error")) cat(cv) else
            cat("coverage:", round(cv$pct_by_line, 2), "%\n")
          # a cross (U+2716) is a failing check; the eyes ones are optional.
          # The summary goes to stderr, where capture.output() does not see it,
          # so the two checks the bot blocks on are also read from the object.
          bad <- any(grepl("\u2716", s)) ||
            inherits(rc, "try-error") || length(rc$errors) > 0 ||
            inherits(cv, "try-error")
          quit(status = as.integer(bad))
          RSCRIPT
          # a memory log every 2 s (container total and its largest processes,
          # with their parents; a test process names its test files), printed
          # at the end and uploaded, so a run stopped for memory says which
          # step, process and test file it was
          swapon --show || true
          docker run -d --name pkc --memory="$MEM" --memory-swap="$MEMSWAP" \
            -e GITHUB_TOKEN -e R_LIBS=/pkg/.pkgcheck/lib \
            -v "$PWD:/pkg" -w /pkg --entrypoint Rscript \
            ghcr.io/ropensci-review-tools/pkgcheck-action:latest \
            .pkgcheck/run.R
          ( while docker inspect -f "{{.State.Running}}" pkc 2>/dev/null | grep -q true; do
              echo "$(date +%T) $(docker stats --no-stream --format "{{.MemUsage}}" pkc 2>/dev/null)"
              docker top pkc -o pid,ppid,rss,args 2>/dev/null | sort -k3 -n -r | head -4 | cut -c1-220
              sleep 2
            done ) > .pkgcheck/mem.log &
          status=$(docker wait pkc)
          docker logs pkc
          echo "== container: $(docker inspect -f "exit {{.State.ExitCode}} oom-killed {{.State.OOMKilled}}" pkc)"
          echo "== the three highest samples, each with the samples around it"
          grep -n "^[0-9][0-9]:[0-9][0-9]:[0-9][0-9] " .pkgcheck/mem.log |
            sort -k2 -h | tail -3 | cut -d: -f1 | while read -r n; do
              echo "-- mem.log line $n"
              sed -n "$((n > 10 ? n - 10 : 1)),$((n + 10))p" .pkgcheck/mem.log
            done
          echo "== last samples"
          tail -15 .pkgcheck/mem.log
          for f in .pkgcheck/fail/*.Rout.fail; do
            [ -f "$f" ] || continue
            echo "== $f (last 80 lines)"
            tail -80 "$f"
          done
          docker rm pkc > /dev/null
          exit "$status"
      - name: memory log and failed test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkgcheck-memory-${{ matrix.mem }}
          path: |
            .pkgcheck/mem.log
            .pkgcheck/fail/
          if-no-files-found: ignore

  # covr alone, as pkgcheck runs it (goodpractice calls
  # covr::package_coverage()), in the same image under the same cap. pkgcheck
  # reports only "Package coverage failed"; this job prints the failing test.
  covr:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: dependencies, without a memory cap
        run: |
          mkdir -p .pkgcheck/lib
          docker run --rm -e GITHUB_TOKEN -e PKG_SYSREQS=false \
            -v "$PWD:/pkg" -w /pkg \
            --entrypoint Rscript \
            ghcr.io/ropensci-review-tools/pkgcheck-action:latest -e '
              .libPaths(c("/pkg/.pkgcheck/lib", .libPaths()))
              pak::lockfile_create("local::.", lockfile = ".pkgcheck/pkg.lock",
                                   dependencies = "all")
              pak::lockfile_install(".pkgcheck/pkg.lock",
                                    lib = "/pkg/.pkgcheck/lib")
            '
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: covr in the bot's image, 2 GB memory cap
        run: |
          cat > .pkgcheck/cov.R <<'RSCRIPT'
          .libPaths(c("/pkg/.pkgcheck/lib", .libPaths()))
          r <- try(
            covr::package_coverage("/pkg", clean = FALSE, quiet = TRUE),
            silent = TRUE
          )
          if (!inherits(r, "try-error")) {
            cat("coverage:", round(covr::percent_coverage(r), 2), "%\n")
            quit(status = 0L)
          }
          msg <- as.character(r)
          cat("covr failed:", substr(msg, 1, 400), "\n")
          f <- regmatches(
            msg, regexpr("/tmp/[^`[:space:]]+testthat\\.Rout\\.fail", msg)
          )
          if (length(f) && file.exists(f)) {
            x <- readLines(f, warn = FALSE)
            hit <- grep(paste0(
              "tests failed in|FAIL [1-9]|^── (Failure|Error)|Killed|",
              "Execution halted|cannot allocate"
            ), x)
            cat("== failing lines\n")
            for (i in hit) {
              writeLines(x[i:min(length(x), i + 25L)])
              cat("--\n")
            }
            cat("== end of the test output\n")
            writeLines(utils::tail(x, 60))
          }
          quit(status = 1L)
          RSCRIPT
          docker run --name pkv --memory=2g --memory-swap=2g \
            -e R_LIBS=/pkg/.pkgcheck/lib \
            -v "$PWD:/pkg" -w /pkg --entrypoint Rscript \
            ghcr.io/ropensci-review-tools/pkgcheck-action:latest \
            .pkgcheck/cov.R
