# The checks the rOpenSci review bot runs on a submission: pkgcheck() in the
# bot's own image, with goodpractice's full R CMD check and covr (the parts
# goodpractice.yml leaves out), srr standards, duplicated names and the rest.
# The container gets a 2 GB memory cap, so a suite that only fits on a large
# runner fails here first instead of on the bot.
name: pkgcheck

on:
  push:
    branches: [ropensci-checks, ropensci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: dependencies, without a memory cap
        # the bot's server has its dependencies already; compiling them here
        # (RcppEigen, stringi, ...) takes more than 2 GB on its own, so they are
        # installed first and the cap covers only what the bot runs
        run: |
          mkdir -p .pkgcheck/lib
          # PKG_SYSREQS=false: the image already has every -dev library the
          # dependencies build against; letting pak add more (gdal-bin from
          # the ubuntugis PPA) fails whenever launchpad.net times out
          docker run --rm -e GITHUB_TOKEN -e PKG_SYSREQS=false \
            -v "$PWD:/pkg" -w /pkg \
            --entrypoint Rscript \
            ghcr.io/ropensci-review-tools/pkgcheck-action:latest -e '
              .libPaths(c("/pkg/.pkgcheck/lib", .libPaths()))
              pak::lockfile_create("local::.", lockfile = ".pkgcheck/pkg.lock",
                                   dependencies = "all")
              pak::lockfile_install(".pkgcheck/pkg.lock",
                                    lib = "/pkg/.pkgcheck/lib")
            '
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: pkgcheck in the bot's image, 2 GB memory cap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > .pkgcheck/run.R <<'RSCRIPT'
          .libPaths(c("/pkg/.pkgcheck/lib", .libPaths()))
          pkgstats::ctags_install(sudo = TRUE)
          x <- pkgcheck::pkgcheck(".")
          s <- capture.output(summary(x))
          writeLines(s)
          gp <- x$goodpractice
          cat("\n== R CMD check\n")
          rc <- gp$rcmdcheck
          if (inherits(rc, "try-error")) cat(rc) else {
            cat("errors:", length(rc$errors), " warnings:",
                length(rc$warnings), " notes:", length(rc$notes), "\n")
            writeLines(c(rc$errors, rc$warnings))
          }
          cat("\n== covr\n")
          cv <- gp$covr
          if (inherits(cv, "try-error")) cat(cv) else
            cat("coverage:", round(cv$pct_by_line, 2), "%\n")
          # a cross (U+2716) is a failing check; the eyes ones are optional.
          # The summary goes to stderr, where capture.output() does not see it,
          # so the two checks the bot blocks on are also read from the object.
          bad <- any(grepl("\u2716", s)) ||
            inherits(rc, "try-error") || length(rc$errors) > 0 ||
            inherits(cv, "try-error")
          quit(status = as.integer(bad))
          RSCRIPT
          # a memory log every 2 s (container total and its largest processes), printed at the
          # end, so a run stopped for memory says which step and process it was
          docker run -d --name pkc --memory=2g --memory-swap=2g \
            -e GITHUB_TOKEN -e R_LIBS=/pkg/.pkgcheck/lib \
            -v "$PWD:/pkg" -w /pkg --entrypoint Rscript \
            ghcr.io/ropensci-review-tools/pkgcheck-action:latest \
            .pkgcheck/run.R
          ( while docker inspect -f "{{.State.Running}}" pkc 2>/dev/null | grep -q true; do
              echo "$(date +%T) $(docker stats --no-stream --format "{{.MemUsage}}" pkc 2>/dev/null)"
              docker top pkc -o pid,rss,args 2>/dev/null | sort -k2 -n -r | head -3 | cut -c1-160
              sleep 2
            done ) > .pkgcheck/mem.log &
          status=$(docker wait pkc)
          docker logs pkc
          echo "== peak memory samples"
          grep "GiB\|MiB" .pkgcheck/mem.log | sort -k2 -h | tail -3
          echo "== last samples"
          tail -12 .pkgcheck/mem.log
          docker rm pkc > /dev/null
          exit "$status"

  # covr alone, as pkgcheck runs it (goodpractice calls
  # covr::package_coverage()), in the same image under the same cap. pkgcheck
  # reports only "Package coverage failed"; this job prints the failing test.
  covr:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: dependencies, without a memory cap
        run: |
          mkdir -p .pkgcheck/lib
          docker run --rm -e GITHUB_TOKEN -e PKG_SYSREQS=false \
            -v "$PWD:/pkg" -w /pkg \
            --entrypoint Rscript \
            ghcr.io/ropensci-review-tools/pkgcheck-action:latest -e '
              .libPaths(c("/pkg/.pkgcheck/lib", .libPaths()))
              pak::lockfile_create("local::.", lockfile = ".pkgcheck/pkg.lock",
                                   dependencies = "all")
              pak::lockfile_install(".pkgcheck/pkg.lock",
                                    lib = "/pkg/.pkgcheck/lib")
            '
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: covr in the bot's image, 2 GB memory cap
        run: |
          cat > .pkgcheck/cov.R <<'RSCRIPT'
          .libPaths(c("/pkg/.pkgcheck/lib", .libPaths()))
          r <- try(
            covr::package_coverage("/pkg", clean = FALSE, quiet = TRUE),
            silent = TRUE
          )
          if (!inherits(r, "try-error")) {
            cat("coverage:", round(covr::percent_coverage(r), 2), "%\n")
            quit(status = 0L)
          }
          msg <- as.character(r)
          cat("covr failed:", substr(msg, 1, 400), "\n")
          f <- regmatches(
            msg, regexpr("/tmp/[^`[:space:]]+testthat\\.Rout\\.fail", msg)
          )
          if (length(f) && file.exists(f)) {
            x <- readLines(f, warn = FALSE)
            hit <- grep(paste0(
              "tests failed in|FAIL [1-9]|^── (Failure|Error)|Killed|",
              "Execution halted|cannot allocate"
            ), x)
            cat("== failing lines\n")
            for (i in hit) {
              writeLines(x[i:min(length(x), i + 25L)])
              cat("--\n")
            }
            cat("== end of the test output\n")
            writeLines(utils::tail(x, 60))
          }
          quit(status = 1L)
          RSCRIPT
          docker run --name pkv --memory=2g --memory-swap=2g \
            -e R_LIBS=/pkg/.pkgcheck/lib \
            -v "$PWD:/pkg" -w /pkg --entrypoint Rscript \
            ghcr.io/ropensci-review-tools/pkgcheck-action:latest \
            .pkgcheck/cov.R
