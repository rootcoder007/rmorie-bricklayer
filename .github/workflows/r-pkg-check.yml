# R CMD check for the rmoriebricklayer package across the full CRAN-relevant
# platform/version matrix. bricklayer now ships compiled C++/libcurl code
# (src/rmbl_fetch.cpp), so the check MUST run on macOS + Windows too -- that
# is where the platform-specific link paths live (-lcurl on Linux/macOS,
# Makevars.win's pkg-config --static libcurl on Windows). A single Linux
# runner would leave "works everywhere" unproven.
name: r-pkg-check

on:
  push:
    branches: [main, ropensci]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-pkg-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # pak queries 5 Bioconductor repos by default; this package needs
      # none of them, and when bioconductor.org is slow the resolver logs
      # "unable to access index for repository .../bioc" on every leg.
      # Documented pak knob (pak NEWS: use_bioconductor / PKG_USE_BIOCONDUCTOR).
      PKG_USE_BIOCONDUCTOR: "false"
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install libcurl (C++ SystemRequirement)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          cache: 'always'
          cache-version: 2

      - name: Roxygenise (generate NAMESPACE + man)
        run: Rscript -e 'roxygen2::roxygenise(); cat("EXPORTS:", sum(grepl("^export", readLines("NAMESPACE"))), "\n")'

      - name: R CMD check
        run: Rscript -e 'rcmdcheck::rcmdcheck(".", args = c("--no-manual", "--as-cran"), error_on = "error")'
