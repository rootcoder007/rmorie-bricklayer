# Build the rmorie-bricklayer container; publish to GHCR on a tag or manual run.
#   ghcr.io/rootcoder007/rmorie-bricklayer:latest   (main + tag)
#   ghcr.io/rootcoder007/rmorie-bricklayer:<tag>     (v*.*.* tags)
#   ghcr.io/rootcoder007/rmorie-bricklayer:sha-<7>   (every build)
# Pushes only on a v*.*.* tag, a manual dispatch or the weekly rebuild; plain pushes build-only.
# The weekly rebuild takes the latest release again with a fresh base image and no cache, so the
# Wolfi and R packages in `latest` and `<version>` pick up their security fixes without a
# release. Every build is scanned with Trivy and fails on a vulnerability of
# any severity that has a fix, before anything is pushed; the pushed image is
# scanned again by its digest.
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pick the source
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
            [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || { echo "unexpected tag: $tag"; exit 1; }
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.src.outputs.ref }}

      - name: Decide whether to push
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Log in to GHCR
        if: steps.decide.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/rmorie-bricklayer
            docker.io/${{ github.repository_owner }}/rmorie-bricklayer
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.src.outputs.version }},enable=${{ github.event_name == 'schedule' }}
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: rmorie-bricklayer:scan
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan for vulnerabilities with a fix
        env:
          TRIVY_VERSION: "0.75.0"
        run: |
          set -euo pipefail
          # the scanner lives outside the build context, so the Push step's
          # `COPY . /bricklayer` cannot put it in the image
          mkdir -p "$RUNNER_TEMP/trivy"
          cd "$RUNNER_TEMP/trivy"
          v="$TRIVY_VERSION"
          base="https://github.com/aquasecurity/trivy/releases/download/v$v"
          tgz="trivy_${v}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/trivy_${v}_checksums.txt"
          grep " $tgz\$" "trivy_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
          # every finding, for the log
          ./trivy image --quiet --scanners vuln --format table \
            rmorie-bricklayer:scan || true
          # the gate: a vulnerability of any severity that an update would fix
          ./trivy image --quiet --scanners vuln --ignore-unfixed \
            --exit-code 1 rmorie-bricklayer:scan

      - name: Push
        id: push
        if: steps.decide.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the image as pushed
        if: steps.decide.outputs.push == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rmorie-bricklayer
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # what users pull: it must hold no fixable vulnerability either
          trivy image --quiet --scanners vuln --ignore-unfixed \
            --exit-code 1 "${IMAGE,,}@$DIGEST"
