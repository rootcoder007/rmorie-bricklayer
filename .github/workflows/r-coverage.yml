# Test coverage via covr, uploaded to Codecov (rOpenSci requires CI with
# coverage reporting). Node 24 actions (checkout@v5).
name: r-coverage

on:
  push:
    branches: [main, ropensci]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # the live transport checks run here as in r-pkg-check.yml: without them the lines only they
      # reach read as uncovered (fetch_native.R fell 38 points on PR #56)
      RMBL_LIVE_TESTS: "1"
      # pak queries 5 Bioconductor repos by default; this package needs
      # none of them, and when bioconductor.org is slow the resolver logs
      # "unable to access index for repository .../bioc" on every leg.
      # Documented pak knob (pak NEWS: use_bioconductor / PKG_USE_BIOCONDUCTOR).
      PKG_USE_BIOCONDUCTOR: "false"
      # the loopback-server and interrupt tests skip_on_cran(): coverage must run the whole suite
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::covr, any::xml2, any::roxygen2, any::srr
          cache: 'always'
          cache-version: 1
      - name: Roxygenise (generate NAMESPACE + man)
        run: roxygen2::roxygenise()
        shell: Rscript {0}
      # Ubuntu 24.04 ships OpenSSL 3.0, and cpsxvrf() needs the openssl
      # program at 3.5 or later (the first with ML-DSA and SLH-DSA): without
      # it the cross-check's tests skip and its lines read as uncovered.
      # Built once from the release tarball (checksum pinned) and cached,
      # with its FIPS provider, so fipsmod()'s tests run on a real module
      # (the package installs it with openssl fipsinstall).
      - name: Cache OpenSSL 3.5
        id: ossl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/openssl-3.5
          key: openssl-3.5.9-fips-${{ runner.os }}-${{ runner.arch }}
      - name: Build OpenSSL 3.5
        if: steps.ossl.outputs.cache-hit != 'true'
        env:
          V: "3.5.9"
          SHA: >-
            603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          u=https://github.com/openssl/openssl/releases/download
          curl -fsSLo o.tgz "$u/openssl-$V/openssl-$V.tar.gz"
          echo "$SHA  o.tgz" | sha256sum -c -
          tar xzf o.tgz && cd "openssl-$V"
          ./Configure --prefix="$HOME/openssl-3.5" --libdir=lib \
            enable-fips no-shared no-docs no-tests > /dev/null
          make -j"$(nproc)" > /dev/null
          make install_sw install_fips > /dev/null
      - name: Put OpenSSL 3.5 first on the PATH
        run: |
          echo "$HOME/openssl-3.5/bin" >> "$GITHUB_PATH"
          "$HOME/openssl-3.5/bin/openssl" version
      - name: Compute coverage
        # the tests as the check jobs run them (r-lib's check action sets NOT_CRAN): the local-server
        # transport and interrupt tests are skipped on CRAN, and were missing from coverage
        env:
          NOT_CRAN: "true"
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE,
                                        install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package"))
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          slug: rootcoder007/rmorie-bricklayer
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Show testthat output on failure
        if: failure()
        run: find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
