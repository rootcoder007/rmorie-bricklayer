name: pkgdown
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pkgdown:
    runs-on: ubuntu-24.04
    # deploys the site to the gh-pages branch
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # pak queries 5 Bioconductor repos by default; this package needs
      # none of them, and when bioconductor.org is slow the resolver logs
      # "unable to access index for repository .../bioc" on every leg.
      # Documented pak knob (pak NEWS: use_bioconductor / PKG_USE_BIOCONDUCTOR).
      PKG_USE_BIOCONDUCTOR: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::pkgdown, any::roxygen2, any::srr
          needs: website
      - name: Roxygenise
        run: roxygen2::roxygenise()
        shell: Rscript {0}
      - name: Build site
        run: pkgdown::build_site_github_pages(dest_dir = "pkg-site", new_process = FALSE, install = TRUE)
        shell: Rscript {0}
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          clean: false
          branch: gh-pages
          folder: pkg-site
