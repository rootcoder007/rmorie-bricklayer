# CI for rmorie-bricklayer: lint the shell scripts, keep the vendored R
# files where they belong, and run the canonical build-and-verify smoke
# test against the real OTIS input so every section of analysis.R is
# exercised rather than recorded as INFO.
#
# The bundle's R dependencies are read from inst/bundle/otis-mrp/config.json
# so this file and the bundle cannot disagree about them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: shellcheck + vendored files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run shellcheck (errors only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck --severity=error
      # configure copies the bundle library (inst/bundle/lib.txt) from R/ at
      # install time. A tracked copy, or one inside a project folder, would
      # drift from R/ (mkbndl() refuses a project file that shadows one).
      - name: Bundle library lives in R/ only
        run: |
          fail=0
          if [ -n "$(git ls-files inst/bundle/lib)" ]; then
            echo "::error::inst/bundle/lib is generated by configure; do not track it"
            fail=1
          fi
          for f in $(grep -vE '^(#|$)' inst/bundle/lib.txt); do
            [ -f "R/$f" ] || { echo "::error::inst/bundle/lib.txt names R/$f, which does not exist"; fail=1; }
            hits="$(find inst/bundle -path inst/bundle/lib -prune -o -name "$f" -print)"
            if [ -n "$hits" ]; then
              echo "::error::copy of R/$f inside a bundle project: $hits"
              fail=1
            fi
          done
          exit $fail

  smoke-test:
    name: build + verify otis-mrp bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Read the bundle's R packages from config.json
        id: pkgs
        run: |
          {
            echo 'list<<EOF'
            jq -r '.r_packages[] | "any::" + .' inst/bundle/otis-mrp/config.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Binary installs + automatic system-dependency handling + caching.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          packages: ${{ steps.pkgs.outputs.list }}

      # The A01 input is 4.7 MB of public data. Cached on the pinned
      # provenance so a changed upstream file changes the key.
      - name: Cache the OTIS A01 input
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .otis-input
          key: otis-a01-${{ hashFiles('inst/bundle/otis-mrp/data_provenance.json') }}

      - name: Fetch the OTIS A01 input
        run: |
          mkdir -p .otis-input
          f=.otis-input/a01_restrictive_confinement_detailed_dataset.csv
          if [ ! -s "$f" ]; then
            url="$(jq -r '.resource.direct_url' inst/bundle/otis-mrp/data_provenance.json)"
            curl -sSfL --retry 3 --retry-delay 5 -o "$f" "$url"
          fi
          ls -la "$f"

      - name: Build and verify the otis-mrp bundle
        run: ./dev/test_build_otis.sh --with-data "$PWD/.otis-input/a01_restrictive_confinement_detailed_dataset.csv"

  # A bundle unzipped and started the way a reviewer starts it, on each OS:
  # the shipped OTIS example on its real data (41 checks PASS) and a project
  # made with mkbndlproj() on real data of its own (2 PASS).
  bundle-launchers:
    name: bundle launchers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Read the bundle's R packages from config.json
        id: pkgs
        run: |
          {
            echo 'list<<EOF'
            jq -r '.r_packages[] | "any::" + .' inst/bundle/otis-mrp/config.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          packages: ${{ steps.pkgs.outputs.list }}

      - name: Cache the OTIS A01 input
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .otis-input
          key: otis-a01-${{ hashFiles('inst/bundle/otis-mrp/data_provenance.json') }}

      - name: Fetch the OTIS A01 input
        run: |
          mkdir -p .otis-input
          f=.otis-input/a01_restrictive_confinement_detailed_dataset.csv
          if [ ! -s "$f" ]; then
            url="$(jq -r '.resource.direct_url' inst/bundle/otis-mrp/data_provenance.json)"
            curl -sSfL --retry 3 --retry-delay 5 -o "$f" "$url"
          fi

      - name: Install the package
        run: R CMD INSTALL --no-test-load .

      - name: Build both bundles with mkbndl()
        shell: Rscript {0}
        run: |
          library(rmoriebricklayer)
          out <- file.path(getwd(), "bundles")
          dir.create(out)
          print(mkbndl("otis-mrp", out,
            data = ".otis-input/a01_restrictive_confinement_detailed_dataset.csv"))
          p <- mkbndlproj(file.path(tempdir(), "demo"), title = "Demo")
          d <- data.frame(group = rep(c("a", "b"), 50), value = rep(c(4, 6), 50))
          utils::write.csv(d, file.path(out, "demo.csv"), row.names = FALSE)
          print(mkbndl(p$dir, out, data = file.path(out, "demo.csv")))

      - name: Unzip the way a reviewer does
        run: |
          cd bundles
          for z in *.zip; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              pwsh -NoProfile -Command "Expand-Archive -Path '$z' -DestinationPath ."
            else
              unzip -q "$z"
            fi
          done
          ls -la */

      - name: Run each bundle's launcher
        run: |
          # every launcher's status is recorded, not fatal at the first one
          set +e
          cd bundles
          fail=0
          for b in otis-mrp_v1_with_data demo_v1_with_data; do
            case "$RUNNER_OS" in
              Windows) (cd "$b" && cmd //c "START_HERE.bat < NUL") ;;
              macOS)   test -x "$b/START_HERE.command" && (cd "$b" && ./START_HERE.command < /dev/null) ;;
              *)       test -x "$b/start_here.sh" && (cd "$b" && ./start_here.sh < /dev/null) ;;
            esac
            rc=$?
            m="$(ls "$b"/results_*/manifest.json 2>/dev/null | head -1)"
            pass="$(grep -o '"status": *"PASS"' "$m" 2>/dev/null | wc -l | tr -d ' ')"
            echo "$b: launcher exit $rc, PASS $pass"
            want=2; [ "$b" = otis-mrp_v1_with_data ] && want=41
            if [ "$rc" -ne 0 ] || [ "$pass" -ne "$want" ]; then
              echo "::error::$b: exit $rc, $pass PASS (want $want)"
              tail -40 "$b"/results_*/run.log 2>/dev/null
              fail=1
            fi
          done
          exit $fail
