# Coverage-guided fuzzing of the parsers that read bytes from outside: the
# DER parser and RSA arithmetic, the decimal-to-double conversion (checked
# against the C library bit for bit), and the SIU report parsers; and
# differential fuzzing against OpenSSL 3.5 (fuzz_ossl: digests, HMAC, PBKDF2,
# ML-KEM, ML-DSA, SLH-DSA must agree byte for byte or verdict for verdict). Built
# with libFuzzer + AddressSanitizer + UndefinedBehaviorSanitizer; a crash,
# a sanitizer report or a conversion mismatch fails the job and uploads
# the reproducer. Sources and seed corpora: inst/fuzz/.
name: fuzz

on:
  push:
    branches: [main]
    paths: ['src/**', 'inst/fuzz/**', '.github/workflows/fuzz.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'inst/fuzz/**', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per target
        default: '120'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libfuzzer:
    name: libFuzzer + ASan + UBSan
    runs-on: ubuntu-24.04
    # Debian 13 ships OpenSSL 3.5, which fuzz_ossl differs against (ML-KEM, ML-DSA, SLH-DSA)
    container: debian:trixie
    timeout-minutes: 60
    env:
      REQUIRE_OSSL35: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang libclang-rt-dev r-base-dev libcurl4-openssl-dev libssl-dev pkg-config ca-certificates
      - name: Build the targets
        run: bash inst/fuzz/build.sh
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.seconds || (github.event_name == 'schedule' && '600') || '120' }}
        run: bash inst/fuzz/run.sh
      - name: Reproducers and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: |
            inst/fuzz/build/crash-*
            inst/fuzz/build/fuzz-*.log
