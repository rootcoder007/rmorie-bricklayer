# SPDX-License-Identifier: AGPL-3.0-or-later
#
# rOpenSci's pkgcheck via the official containerized pkgcheck-action --
# the same engine the @ropensci-review-bot runs on review threads. The
# container ships pkgstats/ami/ctags/cloc pre-built.
name: rOpenSci pkgcheck

on:
  push:
    branches: [main, ropensci]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pkgcheck:
    name: rOpenSci pkgcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      # pkgcheck's own CI check cannot pass without this wait.
      #
      # Its ci_results_gh() fetches /actions/runs?event=push for the whole
      # repository, keeps the most recent run of each workflow NAME, and
      # output_pkgchk_ci() then requires every workflow whose name matches
      # 'cmd|coverage' to have conclusion == "success". Those runs are
      # triggered by the same push as this job, so they are still in
      # flight while pkgcheck gathers its information: conclusion is null,
      # all(NA == "success") is NA, and the NA is coerced to FALSE. The
      # result is "Package fails continuous integration checks" on a
      # repository whose checks all pass -- which is what was happening,
      # every run, while R CMD check reported no errors and no warnings.
      - name: Wait for the runs pkgcheck reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # pkgcheck queries event=push ONLY, and per workflow name takes
          # the single most recent push run. So the exact objects it will
          # read are "the newest push run named R-CMD-check" and "the
          # newest push run named r-coverage" -- not this run's siblings,
          # and not anything triggered by workflow_dispatch. Wait for
          # precisely those, whatever commit they belong to.
          need="R-CMD-check r-coverage"
          for i in $(seq 1 75); do
            # an API hiccup (GitHub answered 503 on 2026-10-03) is a reason to ask again, not to fail
            if ! runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&per_page=100"); then
              echo "[${i}/75] the Actions API did not answer; asking again"
              sleep 20
              continue
            fi
            pending=""
            for wf in $need; do
              # this commit's own run first: the API can list a push's runs a little after
              # the push, and an older push's concluded run then ended the wait at once while
              # this commit's run was still going (2026-10-05, 6fe582f)
              row=$(printf '%s' "$runs" | jq -r --arg n "$wf" --arg sha "$GITHUB_SHA" \
                '[.workflow_runs[] | select(.name == $n and .head_sha == $sha)]
                 | sort_by(.created_at) | last
                 | if . == null then "absent absent"
                   else "\(.status) \(.conclusion // "null")" end')
              st=${row%% *}
              if [ "$st" = "absent" ] && [ "$i" -le 15 ]; then
                # give the push's runs five minutes to appear; a workflow this push did not
                # trigger (a paths filter) never will, and then the newest run is what pkgcheck reads
                pending="$pending $wf(not listed yet)"
                continue
              fi
              if [ "$st" = "absent" ]; then
                row=$(printf '%s' "$runs" | jq -r --arg n "$wf" \
                  '[.workflow_runs[] | select(.name == $n)]
                   | sort_by(.created_at) | last
                   | if . == null then "absent absent"
                     else "\(.status) \(.conclusion // "null")" end')
                st=${row%% *}
              fi
              if [ "$st" != "completed" ] && [ "$st" != "absent" ]; then
                pending="$pending $wf($st)"
              fi
            done
            if [ -z "$pending" ]; then
              echo "the runs pkgcheck will read have concluded:"
              for wf in $need; do
                printf '%s' "$runs" | jq -r --arg n "$wf" \
                  '[.workflow_runs[] | select(.name == $n)]
                   | sort_by(.created_at) | last
                   | "  \(.name): \(.conclusion // "null") (\(.head_sha[0:8]))"'
              done
              exit 0
            fi
            echo "[${i}/75] waiting for:$pending"
            sleep 20
          done
          # Not fatal: pkgcheck still reports every other check, and
          # blocking the whole job on a stuck sibling would hide those.
          echo "gave up waiting; pkgcheck may read an unfinished run"
      # pkgcheck's verdict is the job's verdict: an advisory step that
      # never fails is a check nobody reads.
      #
      # This runs pkgcheck-action's own container and its own /check.R,
      # with one line added. pkgcheck 0.3.4 (CRAN, 2026-10-14) returns the
      # CI-badges section of the report as a list whenever every
      # 'cmd|coverage' workflow passed (output_pkgchk_ci()), so
      # checks_to_markdown() returns a list and the action's
      # writeLines(md, ...) stops with "can only write character objects"
      # -- the job failed precisely because our CI was green. The action
      # pulls the image as :latest, so pkgcheck cannot be pinned there.
      # unlist() restores the character vector the script expects; every
      # check, and the pass/fail rule, is the action's own.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: pkgcheck (pkgcheck-action container)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_TOKEN -e GITHUB_ACTIONS -e GITHUB_REPOSITORY \
            -e GITHUB_SHA -e GITHUB_REF -e GITHUB_SERVER_URL -e GITHUB_API_URL \
            -v "$GITHUB_WORKSPACE":/github/workspace -w /github/workspace \
            --entrypoint bash ghcr.io/ropensci-review-tools/pkgcheck-action:latest -c '
              set -euo pipefail
              awk "{print} /^md <- checks_to_markdown\\(/{print \"md <- unlist(md, use.names = FALSE)\"}" /check.R > /tmp/check.R
              grep -q "^md <- unlist(md" /tmp/check.R
              echo "quit(status = as.integer(length(errors) > 0))" >> /tmp/check.R
              Rscript /tmp/check.R'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pkgcheck-report
          path: .pkgcheck/
          if-no-files-found: ignore
