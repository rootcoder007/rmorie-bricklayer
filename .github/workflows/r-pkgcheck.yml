# SPDX-License-Identifier: AGPL-3.0-or-later
#
# rOpenSci's pkgcheck via the official containerized pkgcheck-action --
# the same engine the @ropensci-review-bot runs on review threads. The
# container ships pkgstats/ami/ctags/cloc pre-built.
name: rOpenSci pkgcheck

on:
  push:
    branches: [main, ropensci-prep]
    paths-ignore: ['docs/**', 'dist/**', 'examples/**', 'dev/**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pkgcheck:
    name: rOpenSci pkgcheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@fa6dc3e9dec0580397ae44ec6fb9e7953947758c # main
        with:
          ref: ${{ github.sha }}
          post-to-issue: false
          summary-only: false
