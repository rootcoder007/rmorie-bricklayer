# Measures the CRAN check time of the CRAN tarball on Windows, the platform whose incoming check
# flagged "Overall checktime > 10 min". The tarball is built exactly as for a CRAN upload
# (dev/cran_build.sh, NOT_CRAN=true at build time), then checked with --as-cran and NOT_CRAN unset,
# PDF manual included, as CRAN runs it. The job summary lists the total and every timed step.
name: cran-timing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev rsync
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          cache: 'always'
      - name: Build the CRAN tarball
        run: bash dev/cran_build.sh "$RUNNER_TEMP/cran"
      - uses: actions/upload-artifact@v4
        with:
          name: cran-tarball
          path: ${{ runner.temp }}/cran/rmoriebricklayer_*.tar.gz

  windows:
    needs: build
    runs-on: windows-latest
    name: windows (${{ matrix.r }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        r: ['devel', 'release']
    env:
      PKG_USE_BIOCONDUCTOR: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::tinytex
          cache: 'always'
      # The minimal TinyTeX lacks LaTeX packages the PDF manual needs, and LaTeX does not say which.
      # Build the manual once through tinytex, which installs every missing package, so the timed
      # check below builds it the way CRAN does.
      - name: LaTeX packages for the PDF manual
        shell: bash
        run: |
          R CMD Rd2pdf --no-preview --batch --no-clean -o manual.pdf . || true
          d=$(ls -d .Rd2pdf* | head -1)
          (cd "$d" && Rscript -e "tinytex::pdflatex('Rd2.tex')")
          rm -rf .Rd2pdf* manual.pdf
      - uses: actions/download-artifact@v4
        with:
          name: cran-tarball
          path: tb
      - name: R CMD check --as-cran, CRAN mode
        shell: bash
        run: |
          unset NOT_CRAN
          tb=$(ls tb/rmoriebricklayer_*.tar.gz)
          t0=$(date +%s)
          R CMD check --as-cran "$tb" > check.txt 2>&1 || true
          t1=$(date +%s)
          {
            echo "## Windows R-${{ matrix.r }}: total $(( t1 - t0 )) s ($(( (t1 - t0) / 60 )) min $(( (t1 - t0) % 60 )) s)"
            echo '```'
            grep -E "\[[0-9]+s" check.txt || true
            grep -A2 "Running .testthat" check.txt || true
            grep -E "^Status" check.txt || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          tail -40 check.txt
          if grep -qE "^Status: .*ERROR" check.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-windows-${{ matrix.r }}
          path: rmoriebricklayer.Rcheck/00check.log
