# Measures the CRAN check time of the CRAN tarball on Windows, the platform whose incoming check
# flagged "Overall checktime > 10 min". The tarball is built exactly as for a CRAN upload
# (dev/cran_build.sh, NOT_CRAN=true at build time), then checked with --as-cran and NOT_CRAN unset,
# PDF manual included, as CRAN runs it. The job summary lists the total and every timed step.
name: cran-timing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev rsync
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::roxygen2
          cache: 'always'
      - name: Build the CRAN tarball
        run: bash dev/cran_build.sh "$RUNNER_TEMP/cran"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cran-tarball
          path: ${{ runner.temp }}/cran/rmoriebricklayer_*.tar.gz

  windows:
    needs: build
    runs-on: windows-latest
    name: windows (${{ matrix.r }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        r: ['devel', 'release']
    env:
      PKG_USE_BIOCONDUCTOR: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      # the PDF manual needs makeindex and the inconsolata font, which the minimal TinyTeX lacks
      - name: LaTeX packages for the PDF manual
        run: tlmgr install makeindex inconsolata
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          cache: 'always'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cran-tarball
          path: tb
      - name: R CMD check --as-cran, CRAN mode
        shell: bash
        run: |
          unset NOT_CRAN
          tb=$(ls tb/rmoriebricklayer_*.tar.gz)
          t0=$(date +%s)
          R CMD check --as-cran "$tb" 2>&1 | while IFS= read -r l; do printf '%s %s\n' "$(date +%s)" "$l"; done > stamped.txt || true
          cut -d' ' -f2- stamped.txt > check.txt
          t1=$(date +%s)
          {
            echo "## Windows R-${{ matrix.r }}: total $(( t1 - t0 )) s ($(( (t1 - t0) / 60 )) min $(( (t1 - t0) % 60 )) s)"
            echo '```'
            grep -E "\[[0-9]+s" check.txt || true
            grep -A2 "Running .testthat" check.txt || true
            grep -E "^Status" check.txt || true
            echo '```'
            echo "### Every step, seconds (the time ends at the step's own line)"
            echo '```'
            awk 'NR==1{p=$1} /^[0-9]+ \* /{d=$1-p; p=$1; $1=""; printf "%5d %s\n", d, substr($0,2)}' stamped.txt | sort -rn | head -40
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          tail -40 check.txt
          if grep -qE "^Status: .*ERROR" check.txt; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: check-windows-${{ matrix.r }}
          path: |
            rmoriebricklayer.Rcheck/00check.log
            rmoriebricklayer.Rcheck/00install.out
            stamped.txt
