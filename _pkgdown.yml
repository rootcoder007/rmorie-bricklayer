url: https://rootcoder007.github.io/rmorie-bricklayer/
# The package is at the repository ROOT. An earlier layout had it in a
# bricklayer/ subdirectory and this pointed there, which made every
# source link on the site 404 long after the layout changed.
repo:
  url:
    home: https://github.com/rootcoder007/rmorie-bricklayer/
    source: https://github.com/rootcoder007/rmorie-bricklayer/blob/main/
    issue: https://github.com/rootcoder007/rmorie-bricklayer/issues/
template:
  bootstrap: 5
  includes:
    in_header: |
      <meta name="google-site-verification" content="8ORzeHrfoPIOrujfV-km-kXCi9HD8dvL5GYH-GqwjYI">

navbar:
