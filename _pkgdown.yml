url: https://rootcoder007.github.io/rmorie-bricklayer/
# The package lives in the bricklayer/ subdirectory of the repo, so the
# default source links (/blob/main/R/...) 404. Point them at the subdir.
repo:
  url:
    home: https://github.com/rootcoder007/rmorie-bricklayer/
    source: https://github.com/rootcoder007/rmorie-bricklayer/blob/main/bricklayer/
    issue: https://github.com/rootcoder007/rmorie-bricklayer/issues/
template:
  bootstrap: 5
  includes:
    in_header: |
      <meta name="google-site-verification" content="8ORzeHrfoPIOrujfV-km-kXCi9HD8dvL5GYH-GqwjYI">

navbar:
  structure:
    right: [search, universe, github]
  components:
    universe:
      icon: fa-box-open
      href: https://rootcoder007.r-universe.dev/rmoriebricklayer
      aria-label: r-universe

home:
  links:
    - text: Install from r-universe
      href: https://rootcoder007.r-universe.dev/rmoriebricklayer
    - text: Analysis package (rmorie)
      href: https://github.com/rootcoder007/rmorie
    - text: Data package (rmoriedata)
      href: https://github.com/rootcoder007/rmoriedata

articles:
  - title: Guides
    navbar: ~
    contents:
      - capsules
      - describe
      - drift
      - provenance
      - yoy
      - tables

reference:
  - title: Fetch open data
    desc: >
      Resilient downloaders with libcurl + Wayback fallback for pulling public
      datasets over flaky endpoints.
    contents:
      - bricklayer_fetch
      - bricklayer_fetch_siu
      - download_data
      - friendly_download
  - title: SIU report mining
    desc: >
      Deterministic, offline parse/resolve core for Ontario Special
      Investigations Unit director's reports — schema, parser,
      subject-official resolver.
    contents:
      - bricklayer_siu_schema
      - bricklayer_parse_siu
      - bricklayer_fetch_parse_siu
      - bricklayer_siu_text
      - bricklayer_siu_iso_date
      - bricklayer_siu_resolve_so
  - title: Portal resolvers
    desc: >
      Turn a dataset identifier on a government open-data portal into a direct
      resource URL — CKAN, Socrata, ArcGIS, and Wayback snapshots.
    contents:
      - resolve_via_ckan
      - resolve_via_ckan_search
      - resolve_via_socrata
      - resolve_via_arcgis
      - wayback_snapshot_url
      - wayback_snapshot_url_native
  - title: Provenance & reproducibility capsules
    desc: >
      Capture the environment, record a citable data-provenance capsule, and
      verify it later so an analysis reproduces from the same inputs.
    contents:
      - capture_environment
      - cite_capsule
      - verify_capsule
      - load_provenance
      - record
      - make_manifest
      - manifest_canonical
      - manifest_recompute
      - manifest_record_seed
      - capture_dependencies
      - write_manifest_json
      - write_summary_txt
      - agent_bundle
  - title: JSON (native codec)
    desc: jsonlite's mapping in base R, byte-for-byte; no jsonlite at run time.
    contents:
      - bricklayer_json_from_json
      - bricklayer_json_to_json
      - rmbl_json_serialize
      - rmbl_json_gzip
      - rmbl_base64
  - title: Integrity & checksums
    desc: SHA-256 hashing and verification for downloaded files.
    contents:
      - sha256_file
      - verify_sha256
      - core_sha256
  - title: Schema validation & synthetic data
    desc: >
      Validate a data frame against a declared schema, and build typed
      synthetic columns/CSVs for tests and documentation.
    contents:
      - apply_schema_validation
      - validate_schema
      - make_synthetic_column
      - make_synthetic_csv
  - title: Text & encoding utilities
    desc: ASCII transliteration and safe text fallbacks for non-UTF-8 sinks.
    contents:
      - to_ascii
      - ascii_fallback
      - write_text_fallback
  - title: Core numeric primitives
    desc: >
      Thin R wrappers over the shared compiled core that the whole ecosystem
      links against via `LinkingTo: rmoriebricklayer`, so every sibling
      package computes with one copy of the arithmetic.
    contents:
      - rmbl_core_stats
      - core_normal_pdf
      - core_normal_logpdf
      - rmbl_core_spread
      - core_moments
      - rmbl_core_robust
      - rmbl_core_trimmed
      - core_weighted
      - rmbl_core_rank
      - core_cov
      - core_bootstrap_mean
      - core_ipw_weights
      - core_gamma_cdf
      - core_hawkes_nll
  - title: Distributional drift
    desc: >
      Whether a freshly fetched column is still the column the capsule was
      pinned against. A byte digest cannot answer this: a re-release can be
      statistically identical yet differ byte-for-byte, and a column can keep
      its name and type while having been silently rescaled.
    contents:
      - capsule_drift
      - drift_ks
      - drift_psi
      - drift_chisq
      - drift_homogeneity
      - benford_test
  - title: Signed provenance
    desc: >
      Authenticated rather than merely checksummed. Keyed digests for a shared
      secret, post-quantum hash-based signatures for a public verifier, Merkle
      trees to pin a capsule chunk by chunk, and hash chains to make the run
      history itself tamper-evident.
    contents:
      - capsule_attest
      - capsule_bundle
      - capsule_falsify
      - prereg_declare
      - falsify_family
      - evalue_rr
      - timestamp_verify
      - capsule_sign
      - capsule_verify
      - pqc_keygen
      - signing_public_key
      - fips_keygen
      - fips_key
      - fips_mu
      - fips_sizes
      - kem_keygen
      - kem_sizes
      - kem_encapsulate
      - kem_decapsulate
      - oqs_keygen
      - pqc_backends
      - rmbl_chain
      - rmbl_merkle
      - chunk_file
  - title: Digests and keys
    desc: >
      The hashes and key-derivation the provenance layer is built on, each
      verified against its published test vectors.
    contents:
      - core_sha512
      - core_crc32
      - core_blake2b
      - rmbl_keyed_digest
      - rmbl_file_digest
      - digest_object
      - random_bytes
      - derive_key
  - title: Schema and rules
    desc: >
      Derive a pinnable schema from data you already trust, then declare the
      project-specific checks a generic schema cannot express.
    contents:
      - infer_schema
      - rule
      - validate_rules
      - rmbl_rule_library
  - title: Period-over-period change
    desc: >
      Year-over-year change matched on the period's own value rather than on
      row order, so a missing year is a gap instead of a quietly multi-year
      comparison. A percent off a small base is withheld with its reason; a
      percentage is reported in percentage points; a ratio of counts carries
      the exact conditional-binomial interval. The same object renders to
      HTML, PDF, CSV, TSV, JSON or Markdown.
    contents:
      - yoy
      - yoy_summary
      - yoy_label
      - fiscal_year_label
      - yoy_render
      - yoy_write
      - yoy_delim
      - yoy_palettes
  - title: Banded categories
    desc: >
      Published categories are intervals -- "2 to 5", "50+" -- and anything
      computed from them rests on where inside each band the mass sits and on
      where the open top band ends. These parse to bounds, make the
      representative-value rule explicit, and measure how far a result moves
      as the open band's assumed cap varies.
    contents:
      - parse_bands
      - band_values
      - expand_bands
      - band_sensitivity
  - title: Concentration and association
    desc: >
      Whether a few units account for most of a total, and how strongly two
      categorical variables move together. Gini is twice the area under its
      own Lorenz curve, and has a ceiling of 1 - 1/n rather than 1. The tail
      index maximises the exact discrete likelihood, the closed-form
      continuity correction being badly biased at the small thresholds
      administrative counts start from.
    contents:
      - concentration
      - hill_tail_index
      - hurwitz_zeta
      - cramers_v
  - title: Trend in a short series
    desc: >
      An annual extract is five to ten points, which supports a rank test and
      a resistant slope but not a model with an autocorrelation structure.
      The step test takes its p-value from the permutation distribution of the
      maximum over splits, not from the best split's own test.
    contents:
      - trend_test
      - step_change
      - count_trend
  - title: Region-coded counts
    desc: >
      A region is an areal unit with a population, not a coordinate. Indirect
      standardisation removes the part of a difference explained by who the
      area holds; empirical Bayes stops a small area's noise from ranking it
      to the top or bottom; a funnel plot shows the reader the same thing
      directly.
    contents:
      - expected_counts
      - sir
      - eb_rates
      - funnel_limits
      - morans_i
  - title: Describe a capsule
    desc: >
      The summaries worth reading before trusting a capsule: what every column
      looks like, where the gaps are, which values dominate, and which rows do
      not belong. `capsule_report()` runs the lot and orders the findings by
      severity.
    contents:
      - capsule_report
      - report_markdown
      - profile_columns
      - inline_hist
      - frequency_table
      - correlation_table
      - top_correlations
      - mahalanobis_outliers
      - duplicate_rows
      - rmbl_drop
      - clean_column_names
      - environment_diff
  - title: Missingness
    desc: >
      Not just how much is missing, but the shape of it -- which columns go
      together, whether the gaps are contiguous, and whether the missingness
      is related to the data (in which case dropping incomplete rows is
      biased).
    contents:
      - missingness_summary
      - missingness_pattern
      - missing_runs
      - missingness_map
      - mcar_test
  - title: Large capsules
    desc: >
      One-pass algorithms for members bigger than memory: exact block-wise
      moments, uniform sampling of a stream, and fixed-memory distinct counts.
    contents:
      - rmbl_online
      - rmbl_reservoir
      - rmbl_distinct
  - title: Output
    desc: Printed reports for the objects the package returns.
    contents:
      - rmbl_print_methods
