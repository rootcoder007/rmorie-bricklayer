reference:
  - title: One call for a published table
    desc: >
      Analyse a table of counts by period and group in one call: exact
      intervals on every change, multiple-comparison adjustment over the
      scan, the envelope that rounding and suppression imply, trend, and a
      drift screen against the prior capsule; then a report and a capsule
      template.
    contents:
      - anltab
      - rptanl
      - pubbnd
      - chgenv
      - yoybnd
      - yoypv
      - scanadj
      - drftcal
      - usecpstmpl
  - title: Fetch open data
    desc: >
      Resilient downloaders with libcurl + Wayback fallback for pulling public
      datasets over flaky endpoints.
    contents:
      - blfetch
      - fetchvrf
      - arccap
      - siufetch
      - dldata
      - fdl
  - title: SIU report mining
    desc: >
      Deterministic, offline parse/resolve core for Ontario Special
      Investigations Unit director's reports — schema, parser,
      subject-official resolver.
    contents:
      - siusch
      - siuprs
      - siufprs
      - siutxt
      - siudate
      - siuso
  - title: Portal resolvers
    desc: >
      Turn a dataset identifier on a government open-data portal into a direct
      resource URL — CKAN, Socrata, ArcGIS, and Wayback snapshots.
    contents:
      - rslvckan
      - rslvckns
      - rslvsoc
      - rslvarc
      - wbsnpurl
      - wbsnpnat
      - wbsave
      - wbrtry
  - title: Provenance & reproducibility capsules
    desc: >
      Capture the environment, record a citable data-provenance capsule, and
      verify it later so an analysis reproduces from the same inputs.
    contents:
      - capenv
      - citecps
      - vrfcps
      - loadprov
      - recrd
      - mkmnf
      - mnfcanon
      - mnfrcmp
      - mnfrecseed
      - capdeps
      - wrmnfjs
      - wrsmrytxt
  - title: Language model and command line
    desc: >
      Language models you bring (a provider's key, an OpenAI-compatible
      server of your own, or a local Ollama), answering from the MORIE
      packages' help; the rmoriebricklayer shell command.
    contents:
      - agentbndl
      - llmask
      - explerr
      - llmcfg
      - dlogin
      - dlogout
      - llmstat
      - svcs
      - llmmdls
      - llmprvd
      - llmrte
      - llmchat
      - dmnf
      - bldl
      - blprog
      - blcli
      - instcli
  - title: JSON (native codec)
    desc: jsonlite's mapping in base R, byte-for-byte; no jsonlite at run time.
    contents:
      - fromjs
      - tojs
      - jsserdoc
      - jsgz
      - b64
  - title: Integrity & checksums
    desc: SHA-256 hashing and verification for downloaded files.
    contents:
      - sha256file
      - vrfsha256
      - csha256
  - title: Categorical integrity
    desc: >
      Labels that cannot be swapped quietly: name-based recodes that refuse
      anything unmapped, explicit levels, an import audit, a before/after
      cross-tabulation proof, counts checked against what was published,
      reported odds ratios checked under every relabelling, and a signed
      manifest of the whole chain.
    contents:
      - grdrcd
      - deccodes
      - grdlvls
      - audcats
      - vrfrcd
      - vrfmrg
      - orchk
      - relbl
      - declbld
      - xfrvrf
      - rlblfrns
      - grdbin
      - rcdmnf
      - wrrcdmnf
  - title: Categorical integrity
    desc: >
      Labels that cannot be swapped quietly: name-based recodes that refuse
      anything unmapped, explicit levels, an import audit, a before/after
      cross-tabulation proof, counts checked against what was published,
      reported odds ratios checked under every relabelling, and a signed
      manifest of the whole chain.
    contents:
      - grdrcd
      - deccodes
      - grdlvls
      - audcats
      - vrfrcd
      - vrfmrg
      - orchk
      - grdbin
      - rcdmnf
      - wrrcdmnf
  - title: Schema validation & synthetic data
    desc: >
      Validate a data frame against a declared schema, and build typed
      synthetic columns/CSVs for tests and documentation.
    contents:
      - schval
      - valsch
      - mksyncol
      - mksyncsv
  - title: Text & encoding utilities
    desc: ASCII transliteration and safe text fallbacks for non-UTF-8 sinks.
    contents:
      - toascii
      - asciifb
      - wrtxtfb
  - title: Core numeric primitives
    desc: >
      Thin R wrappers over the shared compiled core that the whole ecosystem
      links against via `LinkingTo: rmoriebricklayer`, so every sibling
      package computes with one copy of the arithmetic.
    contents:
      - cstat
      - cnormpdf
      - cnormlpdf
      - cspread
      - cmom
      - crob
      - ctrm
      - cwtd
      - crank
      - ccovm
      - cbootmean
      - cipw
      - cgamcdf
      - chwknll
      - chwkfit
      - chwkres
      - cunif
      - chwkjit
  - title: Distributional drift
    desc: >
      Whether a freshly fetched column is still the column the capsule was
      pinned against. A byte digest cannot answer this: a re-release can be
      statistically identical yet differ byte-for-byte, and a column can keep
      its name and type while having been silently rescaled.
    contents:
      - cpsdrft
      - drftks
      - drftpsi
      - drftchisq
      - drfthomog
      - benfordtst
  - title: Signed provenance
    desc: >
      Authenticated rather than merely checksummed. Keyed digests for a shared
      secret, post-quantum hash-based signatures for a public verifier, Merkle
      trees to pin a capsule chunk by chunk, and hash chains to make the run
      history itself tamper-evident.
    contents:
      - cpsatst
      - cpsbndl
      - cpsfals
      - cpspwr
      - prrgdecl
      - falsfam
      - evlrr
      - tsvrf
      - certprs
      - certchnvrf
      - rvkfetch
      - cpssign
      - xmssadv
      - cpsvrf
      - pqckg
      - signpubkey
      - fipskg
      - fipskey
      - fipsmu
      - fipssz
      - kemkg
      - kemsz
      - kemencap
      - kemdecap
      - hqckg
      - hqcsz
      - hqcencap
      - hqcdecap
      - hqccmpkey
      - oqskg
      - pqcbknd
      - chn
      - mrk
      - chnkfile
  - title: Digests and keys
    desc: >
      The hashes and key-derivation the provenance layer is built on, each
      verified against its published test vectors.
    contents:
      - csha512
      - ccrc32
      - cblake2b
      - keyeddgst
      - filedgst
      - dgstobj
      - rndbytes
      - drbgnew
      - drbggen
      - drbgrsd
      - drvkey
  - title: Schema and rules
    desc: >
      Derive a pinnable schema from data you already trust, then declare the
      project-specific checks a generic schema cannot express.
    contents:
      - infsch
      - rul
      - valrules
      - rulelib
  - title: Period-over-period change
    desc: >
      Year-over-year change matched on the period's own value rather than on
      row order, so a missing year is a gap instead of a quietly multi-year
      comparison. A percent off a small base is withheld with its reason; a
      percentage is reported in percentage points; a ratio of counts carries
      the exact conditional-binomial interval. The same object renders to
      HTML, PDF, CSV, TSV, JSON or Markdown.
    contents:
      - yoy
      - yoysmry
      - yoylbl
      - fylbl
      - yoyren
      - yoywr
      - yoydelim
      - yoypals
  - title: Stock and flow over time
    desc: >
      Person-days are one quantity with two denominators. Divided by TIME they
      give the average daily population, a stock: how many are held at once.
      Divided by PEOPLE they give the average length of stay. When stay length
      moves the two can carry opposite signs, so a report quoting one implies
      the wrong direction for the other. After Lakner (1976), A Manual of
      Statistical Sampling Methods for Corrections Planners.
    contents:
      - adp
      - alos
      - admits
      - adpcnts
      - stkflow
      - staysmry
      - perdays
  - title: Rates, shares and rate change
    desc: >
      A count is not comparable across places of different size or years of
      different population, and a share of a total is not a rate per
      population -- labelling one as the other is the most common error in a
      published table, so they are separate functions with separate
      intervals. Rates carry the exact Poisson interval, shares carry
      Wilson-s, and the change in a rate conditions on the two counts and
      corrects for the exposure ratio rather than treating two rates as
      measured numbers.
    contents:
      - rtcalc
      - shrs
      - ratechg
  - title: Banded categories
    desc: >
      Published categories are intervals -- "2 to 5", "50+" -- and anything
      computed from them rests on where inside each band the mass sits and on
      where the open top band ends. These parse to bounds, make the
      representative-value rule explicit, and measure how far a result moves
      as the open band's assumed cap varies.
    contents:
      - prsbands
      - bandvals
      - expbands
      - bandsens
  - title: Concentration and association
    desc: >
      Whether a few units account for most of a total, and how strongly two
      categorical variables move together. Gini is twice the area under its
      own Lorenz curve, and has a ceiling of 1 - 1/n rather than 1. The tail
      index maximises the exact discrete likelihood, the closed-form
      continuity correction being badly biased at the small thresholds
      administrative counts start from.
    contents:
      - concentration
      - hilltlidx
      - hurwzeta
      - cramerv
  - title: Trend in a short series
    desc: >
      An annual extract is five to ten points, which supports a rank test and
      a resistant slope but not a model with an autocorrelation structure.
      The step test takes its p-value from the permutation distribution of the
      maximum over splits, not from the best split's own test.
    contents:
      - trndtst
      - stepchg
      - cnttrnd
  - title: Air pollution, dispersion and health burden
    desc: >
      Pasquill-Gifford dispersion and Briggs plume rise, Gaussian plume and puff,
      grid and particle models; concentration-response functions, attributable
      fraction, displaced mortality, the burden chain per area, the concentration
      index of exposure by income, a cross-fitted exposure-response estimator, and
      the one-call pipeline with its assumption log.
    contents:
      - pgsig
      - crfpm25
      - attrfrac
      - mortdisp
      - polbrdn
      - polbrdarea
      - plrcf
      - exprspplr
      - expconcidx
      - vrfpol
      - plmfld
  - title: Courts and police-reported crime
    desc: >
      Case flow and clearance through a court, time to disposition from banded
      shares, the mix of outcomes, the change in a clearance rate split into rate
      and case-mix effects (Simpson's paradox), where incidents cluster, and
      near-repeat space-time clustering; with real Ontario Court of Justice and
      Toronto Police Service data.
    contents:
      - caseflow
      - lifetbl
      - dispmix
      - clrdcmp
      - crmdens
      - hotpers
      - knoxtst
      - justice-data
  - title: Evaluating a policy
    desc: >
      Difference in differences with two-way fixed effects, event studies,
      staggered adoption (Callaway and Sant'Anna; Wooldridge), the Goodman-Bacon
      decomposition, switching treatments, permutation inference and
      Westfall-Young stepdown p-values, fixed-effects Poisson, synthetic control;
      severity-weighted crime indices, justice-pipeline rates, cumulative risk of
      a first event, and place-based buffers.
    contents:
      - plndid
      - evstudy
      - stgatt
      - bacondcmp
      - swtdid
      - perminf
      - stpdnpv
      - plnpois
      - synctl
      - sevidx
      - piperate
      - cmlrisk
      - bufasgn
      - polex
      - plotevgrid
      - loounit
      - cohtrnd
  - title: Causal estimation on panels
    desc: >
      Double machine learning with fixed effects (lasso, ridge or any learner,
      cross-fitted by unit), matching on pre-treatment trajectories, synthetic
      difference in differences, the wild cluster bootstrap for few clusters,
      sensitivity to departures from parallel trends, and design-based power.
    contents:
      - plndml
      - aipwcf
      - mtchdid
      - baltab
      - syndid
      - wcb
      - tse
      - plnpwr
  - title: First Nations, Metis and Inuit health
    desc: >
      Statistics Canada tables read as published (suppressed cells never imputed),
      distinctions-based comparisons, age-standardised rates, intergenerational
      exposure, and the Truth and Reconciliation Commission Calls to Action.
    contents:
      - sctidy
      - qltyrcd
      - limfrom
      - indgap
      - agestd
      - rategap
      - genexpo
      - exptrnd
      - trccmpl
      - trcprog
      - trcind
      - trchlthgap
      - indtabs
      - indiex
  - title: First Nations, Metis and Inuit mental health and wellness
    desc: >
      Survey estimates taken out of a table with their limits, rated scales compared
      as whole distributions, age-standardised percentages, and wellness reported
      beside distress; Indigenous frameworks of mental wellness put to work as
      estimators (holistic balance, the four directions of the First Nations Mental
      Wellness Continuum, healing as change, connection across places, community-set
      weights), the Community Well-Being index, a test before pooling, and an audit
      of deficit framing.
    contents:
      - scests
      - ordcmp
      - stdprev
      - welprof
      - dualcont
      - holbal
      - mhcont
      - healchg
      - connassoc
      - commidx
      - dstntst
      - cwbscr
      - frmaud
  - title: The 2021 Census Indigenous Population Profile
    desc: >
      The census profile read with its hierarchy, symbols and sample; shares with
      intervals that carry the long-form sample and random rounding; an Indigenous
      standard population; and a Community Well-Being score from public figures.
    contents:
      - cnsprof
      - profshr
      - cnsstd
      - cnscwb
  - title: Complex survey estimation
    desc: >
      Design-based means, totals, proportions and ratios, overall and by domain,
      with variances from replicate weights (Statistics Canada bootstrap, mean
      bootstrap, jackknife, BRR, Fay) or Taylor linearization over strata and
      PSUs, and design-based comparisons between domains.
    contents:
      - svydes
      - svyest
      - svycmp
      - sprd
  - title: The footprint of the computation
    desc: >
      Electricity and CO2-equivalent of an expression, measured from RAPL energy
      counters where the operating system exposes them, otherwise modelled with the
      Green Algorithms method, against a sourced carbon-intensity table.
    contents:
      - co2fp
      - co2int
      - dtctloc
      - raplok
      - fpeqv
  - title: Region-coded counts
    desc: >
      A region is an areal unit with a population, not a coordinate. Indirect
      standardisation removes the part of a difference explained by who the
      area holds; empirical Bayes stops a small area's noise from ranking it
      to the top or bottom; a funnel plot shows the reader the same thing
      directly.
    contents:
      - expcnts
      - stdinc
      - ebrates
      - fnllim
      - morani
  - title: Points, and the regions that contain them
    desc: >
      A region map from point locations to statistical regions is built once and
      read many times, so an error in it reproduces downstream instead of
      showing up there. These check it three ways: that it is internally sound,
      that a recomputation agrees with it cell by cell, and that an assignment
      derived a DIFFERENT way agrees too, which is the only one of the three
      that can catch an error in the original method. The coverage summary
      reports what share of the population lives in a region holding a unit,
      and says each time that the share is context rather than a rate
      denominator: units serve catchments, which a point location does not
      state.
    contents:
      - rgncov
      - rgnmapintg
      - rgnmapcmp
      - rgnmapalt
      - rgnmappts
  - title: Describe a capsule
    desc: >
      The summaries worth reading before trusting a capsule: what every column
      looks like, where the gaps are, which values dominate, and which rows do
      not belong. `cpsrpt()` runs the lot and orders the findings by
      severity.
    contents:
      - cpsrpt
      - rptmd
      - profcols
      - inlhist
      - freqtbl
      - cortbl
      - topcors
      - mahaoutl
      - duprows
      - drp
      - clncolnms
      - envdiff
  - title: Missingness
    desc: >
      Not just how much is missing, but the shape of it -- which columns go
      together, whether the gaps are contiguous, and whether the missingness
      is related to the data (in which case dropping incomplete rows is
      biased).
    contents:
      - misssmry
      - misspat
      - missruns
      - missgrid
      - mcartst
  - title: Large capsules
    desc: >
      One-pass algorithms for members bigger than memory: exact block-wise
      moments, uniform sampling of a stream, and fixed-memory distinct counts.
    contents:
      - onl
      - rsv
      - dstn
  - title: Output
    desc: Printed reports for the objects the package returns.
    contents:
      - printmeth
  - title: Plots
    desc: >
      Every result draws itself with plot(), on base graphics, with one shared
      look and the same customisation everywhere; palettes and session options;
      Lorenz and funnel plots for results that are plain data frames.
    contents:
      - plot-methods
      - blpal
      - plotlrnz
